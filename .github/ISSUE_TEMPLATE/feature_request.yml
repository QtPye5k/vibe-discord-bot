name: Feature request
description: Propose a focused improvement to Vibe.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Check the feature guides and existing requests first. Describe the outcome you need using synthetic examples.
        Keep credentials, private conversations, server exports and voice recordings out of public issues. Follow SECURITY.md for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who needs this, and what current behavior prevents them from doing it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed behavior
      description: Give a concrete example and the expected result. Include permissions, consent or optional setup the feature should respect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current alternatives
      description: Note existing commands, documented features or workarounds you considered.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: I checked for an existing request and removed secrets and private data from this proposal.
          required: true
