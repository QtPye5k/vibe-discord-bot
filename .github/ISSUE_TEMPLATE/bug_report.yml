name: Bug report
description: Report a reproducible problem with Vibe.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        For a suspected vulnerability, follow SECURITY.md in this repository instead of disclosing details here.
        This is public. Never attach .env files, tokens, API keys, webhook/sign-in URLs, private databases, backups, conversations or voice audio. Use synthetic examples and redact IDs and personal information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and the relevant feature guide.
          required: true
        - label: This report contains no credentials, private user data, database files or voice recordings.
          required: true
  - type: input
    id: version
    attributes:
      label: Vibe version or commit
      placeholder: Release tag or commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Runtime and enabled feature
      description: Include OS/architecture, node --version, pnpm --version, startup method and relevant feature/configuration names. Do not paste your environment file or secret values.
      placeholder: Windows 11 x64; Node 24.x; pnpm 11.25.0; pnpm start; voice enabled
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give numbered steps and exact commands with synthetic names and placeholder IDs. Describe relevant requester/bot permissions without uploading server data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include whether it happens consistently and when it began.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Minimal redacted diagnostics
      description: Optional error class/message, timestamp and relevant check results. Review every line first; remove credentials, authorization headers, signed URLs, names, IDs, message content and local personal paths. Do not upload a full runtime log.
      render: text
  - type: textarea
    id: checks
    attributes:
      label: Checks performed
      description: State results of relevant automated checks or doctor output after redaction. Separate manual live tests from automated checks; describe skipped checks without adding credentials.
